# ---------------------------------------------------------------------
#  WYSOKOŚĆ ZASIŁKU: 81,5% ORAZ PODWYŻSZENIE DO ŚWIADCZENIA RODZICIELSKIEGO
# ---------------------------------------------------------------------
  - id: P17
    nazwa: Wniosek o wypłatę zasiłku macierzyńskiego w wysokości 81,5% za cały okres
    kanal: pismo_pracodawca
    wariant: VAR21
    formularz_zus: ZAM
    podstawa_prawna: "art. 30a ust. 1–2; art. 31 ust. 3 ustawy zasiłkowej"
    zrodlo: "Odtworzony z pól I8/G2/C6 (docs/02-dane-do-wnioskow-2026.md § 2.18 W41), nie ze skanu sprawy"
    tresc: |
      {{imie}}
      {{adres}}
      PESEL: {{pesel}}

      {{platnik_nazwa}}

      {{data_pisma}}

      WNIOSEK O WYPŁATĘ ZASIŁKU MACIERZYŃSKIEGO W WYSOKOŚCI 81,5% ZA CAŁY OKRES

      Na podstawie art. 30a ust. 1 ustawy zasiłkowej wnoszę o wypłacenie mi
      zasiłku macierzyńskiego w wysokości 81,5% podstawy wymiaru zasiłku
      za cały okres urlopu macierzyńskiego (urlopu na warunkach urlopu
      macierzyńskiego) oraz za cały okres urlopu rodzicielskiego
      w pełnym wymiarze, z wyłączeniem 9 tygodni drugiego rodzica
      (art. 182¹a § 4 Kodeksu pracy), w okresie od {{urlop_od}} do {{urlop_do}}.

      Oświadczam, że zamierzam korzystać z pełnego wymiaru urlopu
      macierzyńskiego i urlopu rodzicielskiego przez cały okres, a co najmniej
      1 dzień urlopu rodzicielskiego przypadnie w pierwszym roku życia dziecka.

      Poród / przyjęcie dziecka nastąpiło {{data_porodu}}.
      Dziecko: {{dziecko_imie}}. Liczba dzieci: {{liczba_dzieci}}.

      Wniosek składam w terminie 21 dni od dnia porodu albo przyjęcia
      dziecka na wychowanie (art. 30a ust. 1–2 ustawy zasiłkowej).

      {{data_pisma}}
      .....................................
      (podpis)

    pola:
      - { placeholder: urlop_od, zrodlo: "dziecko.dataUrodzenia (dzień porodu / przyjęcia dziecka)" }
      - { placeholder: urlop_do, zrodlo: "koniec planowanego urlopu rodzicielskiego" }
    zalaczniki_typowe:
      - "Odpis skrócony aktu urodzenia dziecka (albo zgoda, by płatnik/ZUS pobrał dane z rejestru)"
    uwagi: |
      Wniosek o 81,5% można złożyć najpóźniej 21 dni po porodzie albo przyjęciu
      dziecka (art. 30a ust. 1–2 ustawy zasiłkowej). Zamiast wniosku wystarczy
      deklaracja, że ubezpieczona zamierza korzystać z pełnego wymiaru.
      Za 9 tygodni drugiego rodzica zasiłek wynosi zawsze 70%
      (art. 31 ust. 3f ustawy zasiłkowej).

