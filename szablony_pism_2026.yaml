        [ ] przyjęciem dziecka na wychowanie w ramach rodziny zastępczej
            (innej niż zawodowa).

      Dziecko: {{dziecko_imie}}, urodzone {{data_porodu}}.
      Przyjęcie dziecka na wychowanie nastąpiło dnia {{data_zdarzenia}}.

      {{#jesli_przysposobienie}}
      Urlop przysługuje mi w wymiarze 20 tygodni (przy jednym dziecku), a przy
      przyjęciu dziecka w wieku do 3 lat — do ukończenia przez dziecko 4 lat.
      {{/jesli_przysposobienie}}

      {{#jesli_zastępca}}
      Urlop przysługuje mi w wymiarze wynikającym z art. 183 § 1 k.p.;
      rodzina zastępcza zawodowa nie ma prawa do tego urlopu.
      {{/jesli_zastępca}}

      {{data_pisma}}
      .....................................
      (podpis)

