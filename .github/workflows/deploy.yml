name: Build and Deploy Docker Compose to GCE

on:
  push:
    branches:
      - main

env:
  REGION: europe-central2
  REPOSITORY: app-images

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      db_changed: ${{ steps.db_check.outputs.changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if db.json changed
        id: db_check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qx "backend/data/db.json"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.REPOSITORY }}/backend"
          docker build -t "${IMAGE_URI}:latest" -t "${IMAGE_URI}:${{ github.sha }}" ./backend
          docker push "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${{ github.sha }}"

      - name: Build and push frontend image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.REPOSITORY }}/frontend"
          docker build -t "${IMAGE_URI}:latest" -t "${IMAGE_URI}:${{ github.sha }}" ./frontend
          docker push "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${{ github.sha }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout docker-compose.yml
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker-compose.yml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Copy docker-compose.yml to VM
        run: |
          gcloud compute scp docker-compose.yml ${{ secrets.GCE_INSTANCE }}:/tmp/docker-compose.yml \
            --zone=${{ secrets.GCE_ZONE }} \
            --tunnel-through-iap

      - name: Pull and restart on VM
        run: |
          DB_CMD=""
          if [ "${{ needs.build.outputs.db_changed }}" == "true" ]; then
            DB_CMD='
              CID=$(sudo docker compose -f /opt/app/docker-compose.yml ps -q backend) &&
              sudo docker rm -f "$CID" &&
              sudo docker volume rm -f app_backend-data &&
            '
          fi

          gcloud compute ssh ${{ secrets.GCE_INSTANCE }} \
            --zone=${{ secrets.GCE_ZONE }} \
            --tunnel-through-iap \
            --command="
              sudo mkdir -p /opt/app &&
              sudo mv /tmp/docker-compose.yml /opt/app/docker-compose.yml &&
              sudo docker compose -f /opt/app/docker-compose.yml pull &&
              ${DB_CMD}
              sudo docker compose -f /opt/app/docker-compose.yml up -d --remove-orphans &&
              sudo docker compose -f /opt/app/docker-compose.yml restart &&
              sudo docker image prune -f
            "