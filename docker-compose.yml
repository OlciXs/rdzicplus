services:
  backend:
    # PROJECT_ID ustawiony na serwerze (deploy); lokalnie domyślnie "local", żeby
    # `docker compose up --build` z README działało bez dodatkowych zmiennych.
    image: europe-central2-docker.pkg.dev/${PROJECT_ID:-local}/app-images/backend:latest
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      # hasło panelu admina (/admin); puste = hasło demo z backend/server.js
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/hello').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: europe-central2-docker.pkg.dev/${PROJECT_ID:-local}/app-images/frontend:latest
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:4173"
    restart: unless-stopped

volumes:
  backend-data: